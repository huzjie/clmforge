[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clmforge"
version = "1.0.0"
description = "Contrastive Language Model for fast decision-making — score candidate actions via shared state-action embeddings instead of generating text."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "clmforge contributors" }]
keywords = ["contrastive", "decision", "llm", "agent", "tool-calling", "latency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
clmforge = "clmforge.cli:main"

[tool.setuptools.packages.find]
include = ["clmforge*"]
